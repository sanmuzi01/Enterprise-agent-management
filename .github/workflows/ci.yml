name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: agent_sql
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      APP_ENV: test
      DB_USER: root
      DB_PASSWORD: ci-root-password
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: agent_sql
      JWT_SECRET_KEY: ci-only-jwt-secret-not-used-in-production
      JWT_ALGORITHM: HS256
      LLM_ENCRYPTION_KEY: LG5sThiGcVsg9jRbbN_fezONjfKdo3E72yQPYIUwZHQ=
      REDIS_URL: ""
      SMS_PROVIDER: console

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Byte-compile sources
        run: python -m compileall -q FasdtApi service models utils scripts tests

      - name: Lint (ruff)
        run: ruff check FasdtApi service models utils scripts tests

      - name: Dependency vulnerability scan (pip-audit)
        # 只忽略"当前没有可升级版本"的漏洞（每条都写明原因，定期复查——上游出新版本就摘掉对应 --ignore-vuln）。
        # CVE-2026-85394（python-jose 3.5.0，目前没有修复版本）：只有“拿公钥当 HMAC 密钥验证、且不限定算法”时才能伪造令牌；
        # 本项目用 HS256 + 服务端私有密钥，并且 jwt.decode 显式写了 algorithms=[ALGORITHM]（service/auth.py），不满足利用条件。
        # 上游发布修复版本后就摘掉这条 --ignore-vuln，并升级 requirements.txt。
        # 其余漏洞（有修复版本却没升级）会让这一步失败，阻断 PR：见 requirements.txt 和 docs/testing.md「依赖漏洞扫描」。
        run: |
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2026-286 \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-1325 \
            --ignore-vuln CVE-2026-85394

      - name: Vulnerability exception register (owner / reason / expiry)
        # 上一步忽略的每条漏洞都要登记在 .github/vuln-exceptions.json（负责人、原因、复查办法、到期日）；到期没复查就失败。
        run: python scripts/check_vuln_exceptions.py

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent; then
              echo "MySQL is up"; break
            fi
            echo "waiting for mysql... ($i)"; sleep 2
          done

      - name: Alembic builds the full schema from an empty database (Phase 3A)
        # CI 的 MySQL 服务每次都是全新空库，天然适合验证"alembic upgrade head 能不能
        # 独立把库建完整"——不依赖后面的 create_all()。同时确认模型（Base.metadata）
        # 跟迁移链没有漂移，见 docs/db-migration-plan.md 和 scripts/check_no_migration_drift.py。
        run: |
          python -m alembic upgrade head
          python scripts/check_no_migration_drift.py

      - name: Bootstrap database (schema + idempotent migration smoke test)
        run: |
          python -c "from models.init_db import bootstrap_database; bootstrap_database(force=True)"
          # 再跑一次（新进程），验证幂等：不应报错、不应重复建列/索引
          python -c "from models.init_db import bootstrap_database; bootstrap_database(force=True)"

      - name: Run unit tests with coverage
        run: |
          coverage run -m unittest discover -s tests -p "test_*.py" -v
          # 先出报告文件，再判是否达标——判定失败时也要能下载到 coverage.xml 看是哪里掉的
          coverage xml
          # 之前起点是 64%（基线约 64.6%）；这轮新增的并发/签名安全回归测试把真实基线
          # 推到了约 67%，按 docs/testing.md 的既定方法把门槛调高一档到 65（留出安全边际，
          # 不直接顶到当前真实值），后续随测试补齐继续调高，目标 75%。
          coverage report --fail-under=65

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability scan (npm audit)
        # 只挡 high/critical；moderate 及以下（目前是 echarts 一条 XSS，升级到 6.x 是破坏性大版本，
        # 见 docs/testing.md）只报告不阻断，避免 CI 被"暂时改不动"的中低危漏洞长期卡住。
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests (Vitest)
        # 登录会话 / CSRF 头 / Markdown 安全渲染 / 请求拦截器：纯前端逻辑，不依赖后端，几秒钟跑完。
        run: npm test

      - name: Type-check and build
        run: npm run build

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise-business-hub
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: enterprise_business
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      ENTERPRISE_DB_HOST: 127.0.0.1
      ENTERPRISE_DB_PORT: "3306"
      ENTERPRISE_DB_NAME: enterprise_business
      ENTERPRISE_DB_USER: root
      ENTERPRISE_DB_PASSWORD: ci-root-password

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: enterprise-business-hub/pom.xml

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent; then
              echo "MySQL is up"; break
            fi
            echo "waiting for mysql... ($i)"; sleep 2
          done

      - name: Run tests (real HTTP + real MySQL, not mocks)
        # 跟 docs/enterprise-business-hub-plan.md 里手动验证的方式一样：SignedRequestContextFilter
        # → Controller → Service → 真实 MySQL 全链路，Flyway 在这个全新库上先建表。之前这些测试
        # 只在本机手动跑过（Java 权限逻辑改坏了 CI 拦不住），这一步接上之后每次提交都会自动跑。
        run: mvn -B test

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-surefire-reports
          path: enterprise-business-hub/target/surefire-reports/
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: agent_sql
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_USER: root
      DB_PASSWORD: ci-root-password
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: agent_sql
      JWT_SECRET_KEY: ci-only-jwt-secret-not-used-in-production
      JWT_ALGORITHM: HS256
      LLM_ENCRYPTION_KEY: LG5sThiGcVsg9jRbbN_fezONjfKdo3E72yQPYIUwZHQ=
      REDIS_URL: ""
      SMS_PROVIDER: console

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Playwright browser (chromium)
        run: playwright install --with-deps chromium

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent; then
              echo "MySQL is up"; break
            fi
            echo "waiting for mysql... ($i)"; sleep 2
          done

      - name: Browser smoke test (7 core flows)
        # 真实前端 + 真实后端 + 真实数据库 + 内嵌 ChromaDB，只有大模型/向量化两处换成进程内假实现
        # （不花钱、不需要联网）——见 scripts/e2e_smoke.py 顶部说明和 docs/testing.md「浏览器冒烟测试」。
        run: python scripts/e2e_smoke.py

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: tests_e2e/.e2e_data/*
          retention-days: 14
