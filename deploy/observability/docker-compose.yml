# 可观测性与事件总线联调环境：Kafka（KRaft 单节点）+ OpenTelemetry Collector + Loki + Tempo + Prometheus + Grafana。
# 只用于本机联调 / 验收：端口全部只绑 127.0.0.1，数据放在具名卷里，不动项目根目录的 docker-compose.yml。
#   启动：docker compose -f deploy/observability/docker-compose.yml up -d
#   停止并清掉数据：docker compose -f deploy/observability/docker-compose.yml down -v
name: enthub-obs

services:
  kafka:
    image: apache/kafka:3.8.1
    container_name: enthub-kafka
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  loki:
    image: grafana/loki:3.2.0
    container_name: enthub-loki
    command: ["-config.file=/etc/loki/loki.yml"]
    ports: ["127.0.0.1:3100:3100"]
    volumes: ["./loki.yml:/etc/loki/loki.yml:ro", "loki-data:/loki"]

  tempo:
    image: grafana/tempo:2.6.1
    container_name: enthub-tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports: ["127.0.0.1:3200:3200"]
    volumes: ["./tempo.yml:/etc/tempo/tempo.yml:ro", "tempo-data:/var/tempo"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: enthub-otel
    command: ["--config=/etc/otelcol/config.yml"]
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:4318:4318", "127.0.0.1:13133:13133"]
    volumes: ["./otel-collector.yml:/etc/otelcol/config.yml:ro"]
    depends_on: [loki, tempo]

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: enthub-prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-remote-write-receiver"]
    ports: ["127.0.0.1:9090:9090"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro", "../prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml:ro"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  grafana:
    image: grafana/grafana:11.3.0
    container_name: enthub-grafana
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin-local-only
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/provisioning/dashboards/json:/var/lib/grafana-dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [loki, tempo, prometheus]

volumes:
  kafka-data:
  loki-data:
  tempo-data:
  grafana-data:
