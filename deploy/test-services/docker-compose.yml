# 测试用的 MySQL 和 Redis：一条命令起来，让本地也能跑完整的测试（没有它们，依赖 MySQL / Redis 的用例会自动跳过，
# 容易误以为“全绿”）。只绑定本机；用完 `docker compose -f deploy/test-services/docker-compose.yml down -v` 清掉。
#
#   docker compose -f deploy/test-services/docker-compose.yml up -d
#   # PowerShell：
#   $env:DB_HOST='127.0.0.1'; $env:DB_PORT='3307'; $env:DB_USER='root'; $env:DB_PASSWORD='ci-root-password'; $env:DB_NAME='agent_sql'
#   $env:ENTERPRISE_DB_PORT='3307'; $env:ENTERPRISE_DB_PASSWORD='ci-root-password'
#   $env:REDIS_URL='redis://127.0.0.1:6390/0'      # 只给 tests/test_redis_concurrency.py 用；全量测试不要设（会让所有测试都走 Redis）
#   .venv\Scripts\python.exe -m alembic upgrade head
#   .venv\Scripts\python.exe -m unittest discover -s tests -p "test_*.py"
#
# 口令只是本机测试用的，和 CI（.github/workflows/ci.yml）里用的一样；不要用在任何有真实数据的环境里。
services:
  mysql:
    image: mysql:8.0
    ports: ["127.0.0.1:3307:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: ci-root-password
      MYSQL_DATABASE: agent_sql
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/01-enterprise-business.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pci-root-password"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6390:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
