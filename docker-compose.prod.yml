# 生产部署：db / redis / chroma / api / worker 全部容器化，跑在同一台机器上。
# 前端构建产物 + HTTPS 走宿主机 Nginx + certbot，见 docs/deployment.md ——
# 容器化 TLS 终结/挂载证书的复杂度换不来什么好处，没必要凑。
#
# 注意：db 是自建 MySQL 容器，数据全部在 mysql_data 这个具名卷里，没有云 RDS 那种
# 托管自动备份 —— 必须自己定期跑 docs/deployment.md 里的 mysqldump 备份，
# 且要连着这台机器一起考虑容灾（机器没了，卷也没了）。等有真实客户/流量后，
# 优先迁到云数据库（RDS），别长期靠这个自建容器撑生产。
#
# 启动：
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d db
#   （等 db healthy 后再迁移，见下面 docker compose ps 确认；这一步用 root，
#    因为要建表——DB_USER/DB_PASSWORD 这时候已经是下面的业务运行时账号，
#    没有 DDL 权限，必须显式覆盖成 root）：
#   set -a; . .env; set +a
#   docker compose -f docker-compose.prod.yml run --rm -e DB_USER=root -e DB_PASSWORD="$MYSQL_ROOT_PASSWORD" \
#     api python -m alembic upgrade head
#   docker compose -f docker-compose.prod.yml up -d
#   （等 api / enterprise-hub 都 healthy，两边的 audit_event 表都建好后，设了
#    AUDIT_DB_USER 才需要这一步——把最小权限账号的 GRANT 补上，见 .venv/Scripts/python.exe
#    scripts/grant_audit_db_privileges.py 顶部说明。跑一次即可，重复跑也安全）：
#   docker compose -f docker-compose.prod.yml exec api python scripts/grant_audit_db_privileges.py
#
# .env 需要这几项（对应本文件里的服务名，不是 127.0.0.1）：
#   DB_HOST=db
#   MYSQL_ROOT_PASSWORD=<强密码，只给 db 容器自己启动、建账号、跑迁移这类管理操作用；
#                         api/worker/enterprise-hub 平时干活完全不碰这个密码>
#   DB_USER=app_runtime                 （业务运行时账号，只有 SELECT/INSERT/UPDATE/DELETE，
#                                         没有 DDL；deploy/mysql-init/03-create-app-runtime-users.sh 建的）
#   DB_PASSWORD=<强密码，DB_USER 对应的密码，不能跟 MYSQL_ROOT_PASSWORD 一样>
#   DB_NAME=agent_sql
#   DB_AUTO_BOOTSTRAP=0                 （关掉进程内自动建表/迁移，表结构完全交给 alembic
#                                         upgrade head 管，运行时账号也就永远不需要 DDL 权限）
#   REDIS_URL=redis://redis:6379/0
#   CHROMA_SERVER_HOST=chroma
#   CHROMA_SERVER_PORT=8000
#   ENTERPRISE_HUB_BASE_URL=http://enterprise-hub:8090
#   ENTERPRISE_HUB_HMAC_SECRET=<跟下面 enterprise-hub 服务用的同一个值>
#   ENTERPRISE_DB_USER=app_runtime_java （Java 侧业务运行时账号，同样只有 DML，没有 DDL）
#   ENTERPRISE_DB_PASSWORD=<强密码，不能跟 MYSQL_ROOT_PASSWORD 或 DB_PASSWORD 重复>
#   AUDIT_DB_USER=audit_writer          （生产环境必填——不设就退回 DB_USER 写审计，等于
#                                         没有独立的最小权限账号，service/config_validation.py
#                                         会在生产环境启动时直接拦下来，不是可选项）
#   AUDIT_DB_PASSWORD=<强密码，设了 AUDIT_DB_USER 就必须设，同样是生产环境必填>
#
# 关于 root：业务服务（api/worker/enterprise-hub 处理真实请求那条路径）现在完全不用 root，
# 只有两处还会短暂用到——上面手动跑的 alembic 迁移，和 enterprise-hub-migrate 这个一次性
# 容器（第五轮审计 P1-3：之前 Flyway 建表是长驻的 enterprise-hub 容器自己在启动时跑的，
# MYSQL_ROOT_PASSWORD/FLYWAY_DB_* 就一直放在这个处理真实业务请求的进程的环境变量里，
# 被攻破了能从 /proc/self/environ 之类的地方读到 root 密码；现在拆成单独一个只跑 Flyway、
# 跑完就退出的容器，`docker compose up -d` 会先跑完它、确认退出码是 0 才起长驻的
# enterprise-hub，长驻服务本身的环境变量里完全不出现 root 密码）。一个被攻破的、只处理
# 业务请求的进程连接的是限权账号，改不了表结构、建不了新账号、拿不到 mysql.user 之类的
# 系统表。
#
# 老部署升级：之前 DB_USER=root 的部署要先在 .env 里补上 MYSQL_ROOT_PASSWORD（哪怕跟旧的
# DB_PASSWORD 相同也先能跑，之后务必改成不同的值），把 DB_USER/DB_PASSWORD、
# ENTERPRISE_DB_USER/ENTERPRISE_DB_PASSWORD 改成上面新账号的值，因为初始化脚本不会对已经
# 初始化过的数据卷重跑，要手动建号一次（把 deploy/mysql-init/03-create-app-runtime-users.sh
# 里的 SQL 抄出来，用 `docker compose exec db mysql -uroot -p` 手动跑一遍），再重启
# api/worker/enterprise-hub。
#
# enterprise-hub（Phase 5，企业业务中心）第一次跟 db 一起起时，db 容器还是空的，
# deploy/mysql-init/ 下的脚本会自动建好 enterprise_business 库；如果 db 之前已经
# 初始化过（老部署新增这个服务），初始化脚本不会重跑，要手动建一次：
#   docker compose -f docker-compose.prod.yml exec db mysql -uroot -p -e \
#     "CREATE DATABASE IF NOT EXISTS enterprise_business CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      # 独立的管理密码，只给这个容器自己启动/建账号/跑迁移用，跟下面业务运行时
      # 账号的密码（DB_PASSWORD）彻底分开——业务进程平时干活不会碰到这个值。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-agent_sql}
      # 供 deploy/mysql-init/02-create-audit-user.sh 建审计写入专用最小权限账号
      # （只给 audit_event 表 INSERT/SELECT）。留空会跳过创建，审计写入退回主账号。
      AUDIT_DB_USER: ${AUDIT_DB_USER:-audit_writer}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:-}
      # 供 deploy/mysql-init/03-create-app-runtime-users.sh 建业务服务运行时账号
      # （只给对应库 SELECT/INSERT/UPDATE/DELETE，没有 DDL）——api/worker 用
      # APP_DB_*，enterprise-hub 用 JAVA_APP_DB_*，两个服务分开建号、互不连带。
      APP_DB_USER: ${DB_USER:-app_runtime}
      APP_DB_PASSWORD: ${DB_PASSWORD:-}
      JAVA_APP_DB_USER: ${ENTERPRISE_DB_USER:-app_runtime_java}
      JAVA_APP_DB_PASSWORD: ${ENTERPRISE_DB_PASSWORD:-}
    volumes:
      - mysql_data:/var/lib/mysql
      # 只在数据卷为空（第一次初始化）时跑一次，给 enterprise-business-hub 建它自己的库。
      - ./deploy/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  chroma:
    image: chromadb/chroma:1.5.9
    restart: unless-stopped
    volumes:
      - chroma_data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8000"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      args:
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
    restart: unless-stopped
    env_file: .env
    volumes:
      - app_data:/app/data
      - knowledge_data:/app/knowledge_files
      - prompt_data:/app/prompt/prompts
      - skill_enterprise:/app/skills/enterprise    # 部门 Agent 的专业技能配置（运行时生成，重建容器不能丢）
      - skill_imports:/app/skills/imported
      - skill_user_created:/app/skills/user_created
      - skill_templates:/app/skills/user_templates
      - skill_packages:/app/skills_packages/imported
      - chart_data:/app/static/charts
      - agent_templates:/app/agent_templates
      - app_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      chroma:
        condition: service_healthy
    ports:
      # 只绑本机回环：不直接对公网暴露，由宿主机 Nginx 反代并终结 HTTPS。
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
      args:
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
    restart: unless-stopped
    command: python -m service.background_worker
    env_file: .env
    volumes:
      - app_data:/app/data
      - knowledge_data:/app/knowledge_files
      - prompt_data:/app/prompt/prompts
      - skill_enterprise:/app/skills/enterprise    # 部门 Agent 的专业技能配置（运行时生成，重建容器不能丢）
      - skill_imports:/app/skills/imported
      - skill_user_created:/app/skills/user_created
      - skill_templates:/app/skills/user_templates
      - skill_packages:/app/skills_packages/imported
      - chart_data:/app/static/charts
      - agent_templates:/app/agent_templates
      - app_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      chroma:
        condition: service_healthy

  # 企业业务中心的一次性迁移容器（第五轮审计 P1-3）：跟长驻的 enterprise-hub
  # 用同一个镜像，只是把 spring.main.web-application-type 设成 none（不起
  # Web 服务器，Flyway 迁移跑在 ApplicationContext 初始化过程中，跑完
  # main() 就正常返回、JVM 自己退出——本机验证过：真实 MySQL + 真实 Flyway
  # 迁移，跑完进程退出码是 0，不需要额外写退出逻辑）。MYSQL_ROOT_PASSWORD/
  # FLYWAY_DB_* 只出现在这一个跑完就退出的容器里；长驻的 enterprise-hub
  # 完全不持有这些凭据，被攻破也读不到 root 密码。
  enterprise-hub-migrate:
    build:
      context: ./enterprise-business-hub
    restart: "no"
    environment:
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      ENTERPRISE_DB_HOST: db
      ENTERPRISE_DB_PORT: "3306"
      ENTERPRISE_DB_NAME: enterprise_business
      # 迁移容器直接用 root——它唯一的工作就是建表，用完就退出，不处理任何
      # 外部业务请求，没有必要再单独配一个"有 DDL 权限但受限"的中间账号。
      ENTERPRISE_DB_USER: root
      ENTERPRISE_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 设置 MYSQL_ROOT_PASSWORD}
      FLYWAY_DB_USER: root
      FLYWAY_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 设置 MYSQL_ROOT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  # 企业业务中心（Phase 5，docs/enterprise-business-hub-plan.md）：OA/采购/CRM
  # 三个业务域，跟 api 共用同一个 db 容器但是独立的库（enterprise_business，
  # 上面 db 的 init 脚本建的）。ENTERPRISE_HUB_HMAC_SECRET 必须和 .env 里
  # api/worker 用的那个一致（FastAPI 签名、Java 验签，见 .env.production.example）。
  enterprise-hub:
    build:
      context: ./enterprise-business-hub
    restart: unless-stopped
    environment:
      ENTERPRISE_DB_HOST: db
      ENTERPRISE_DB_PORT: "3306"
      ENTERPRISE_DB_NAME: enterprise_business
      # 主 datasource（JPA/Hibernate/JdbcTemplate，处理真实业务请求那条路径）
      # 用最小权限账号，不是 root——只有 SELECT/INSERT/UPDATE/DELETE，
      # deploy/mysql-init/03-create-app-runtime-users.sh 建的。
      ENTERPRISE_DB_USER: ${ENTERPRISE_DB_USER:-app_runtime_java}
      ENTERPRISE_DB_PASSWORD: ${ENTERPRISE_DB_PASSWORD:?请在 .env 设置 ENTERPRISE_DB_PASSWORD}
      # 迁移交给上面的 enterprise-hub-migrate 一次性容器，这个长驻容器不再
      # 自己跑 Flyway——所以完全不需要 FLYWAY_DB_USER/FLYWAY_DB_PASSWORD/
      # MYSQL_ROOT_PASSWORD 这几个变量，环境变量里不会出现 root 密码，
      # 被攻破也读不到。
      SPRING_FLYWAY_ENABLED: "false"
      ENTERPRISE_HUB_HMAC_SECRET: ${ENTERPRISE_HUB_HMAC_SECRET:?请在 .env 设置 ENTERPRISE_HUB_HMAC_SECRET}
      # 审计事件写入专用最小权限账号（只给 audit_event 表 INSERT/SELECT），
      # 跟 db 服务里建号脚本用的是同一对账号密码，见上面 db.environment 的注释。
      AUDIT_DB_USER: ${AUDIT_DB_USER:-audit_writer}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      # 必须等迁移容器真的跑完且退出码是 0（不是"启动了"，是"成功跑完退出"）——
      # 长驻服务不再自己建表，业务运行时账号也没有 DDL 权限，先起 enterprise-hub
      # 会直接因为表不存在而报错。
      enterprise-hub-migrate:
        condition: service_completed_successfully
    ports:
      # 只绑本机回环，跟 api 一样不直接对公网暴露；FastAPI 通过
      # ENTERPRISE_HUB_BASE_URL=http://enterprise-hub:8090 在容器网络内部访问。
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Skill 脚本沙箱（可选，默认不启动）。开启：.env 里设 SANDBOX_ENABLED=true 和 SANDBOX_TOKEN，
  #   docker compose -f docker-compose.prod.yml --profile sandbox up -d --build sandbox sandbox-gw
  # 它会执行导入的 Skill 里的 Python 脚本，也就是"跑第三方代码"，所以隔离做得很死：
  #  - 只挂在 internal 网络 sandbox_net 上：没有外网出口，也连不到 db / redis / chroma / api / worker
  #    （api / worker 不在这个网络里，它们通过下面的网关 sandbox-gw 间接调用沙箱）
  #  - 不带 .env，进程里没有任何业务密钥
  #  - 只读根文件系统，只有 tmpfs 可写（重启即清空）；非 root；丢掉全部 Linux capability
  #  - CPU / 内存 / 进程数硬上限，防止一个脚本把整台机器拖死
  sandbox:
    profiles: ["sandbox"]
    image: agent-platform-sandbox
    build:
      context: ./sandbox
      args:
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
    restart: unless-stopped
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}
      SANDBOX_MAX_CONCURRENT: "2"
    networks:
      - sandbox_net
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /work:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  # 沙箱网关：唯一同时在「默认网络」和「sandbox_net」上的容器，只把 GET /health 和 POST /run 转发给固定的上游（沙箱）。
  # 这样 api / worker 能用沙箱，而沙箱里的脚本看得到的只有网关，网关又只通向沙箱自己，到不了 api。
  # 复用沙箱镜像（不需要额外拉镜像），只是启动命令不同。
  sandbox-gw:
    profiles: ["sandbox"]
    image: agent-platform-sandbox
    command: ["python", "/opt/runner/gateway.py"]
    restart: unless-stopped
    depends_on:
      - sandbox
    environment:
      GATEWAY_UPSTREAM: http://sandbox:8090
    networks:
      - default
      - sandbox_net
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  # internal: true = 容器之间能互通，但不能访问外网
  sandbox_net:
    internal: true

volumes:
  mysql_data:
  redis_data:
  chroma_data:
  app_data:
  knowledge_data:
  prompt_data:
  skill_enterprise:
  skill_imports:
  skill_user_created:
  skill_templates:
  skill_packages:
  chart_data:
  agent_templates:
  app_logs:
