server:
  port: 8090

spring:
  application:
    name: enterprise-business-hub
  main:
    # 第五轮审计 P1-3：一次性迁移容器（docker-compose.prod.yml 的
    # enterprise-hub-migrate 服务）把这个设成 none——不起 Web 服务器，Flyway
    # 迁移跑在 ApplicationContext 初始化过程中，跑完 main() 就正常返回、JVM
    # 退出（没有 servlet 容器/@Scheduled 之类的非 daemon 线程继续占着进程）。
    # 长驻的 enterprise-hub 服务保持默认的 servlet，不受影响。
    web-application-type: ${SPRING_MAIN_WEB_APPLICATION_TYPE:servlet}
  datasource:
    url: jdbc:mysql://${ENTERPRISE_DB_HOST:127.0.0.1}:${ENTERPRISE_DB_PORT:3306}/${ENTERPRISE_DB_NAME:enterprise_business}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${ENTERPRISE_DB_USER:root}
    password: ${ENTERPRISE_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # 表结构完全交给 Flyway 管，Hibernate 不自动建/改表——跟主项目 Alembic 权威化
      # 是同一个原则：schema 变更必须走一份可审查的迁移文件，不能让 ORM 隐式生成。
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    # 第五轮审计 P1-3：长驻的 enterprise-hub 服务不再自己跑迁移（设
    # SPRING_FLYWAY_ENABLED=false），迁移单独交给一次性的
    # enterprise-hub-migrate 服务（这里保持默认 true）——这样 MYSQL_ROOT_PASSWORD/
    # FLYWAY_DB_USER/FLYWAY_DB_PASSWORD 只出现在那个跑完就退出的容器的环境变量里，
    # 不会在处理真实业务请求的长驻进程里放一整个生命周期。
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    # 迁移账号跟主 datasource 账号分开：主 datasource（上面的 spring.datasource.*，
    # JPA/Hibernate/JdbcTemplate 处理真实业务请求用）应该是只有 DML 权限的最小权限
    # 账号，但 Flyway 建表/改表需要 DDL——两者不能是同一个账号，不然运行时账号就
    # 必须保留建表权限，等于没有限权。未单独设置 FLYWAY_DB_* 时退回主 datasource
    # 的账号（本地开发/测试两者一样，都是同一个 root 风格账号，行为不变）；生产
    # 环境用有 DDL 权限的账号跑迁移（见 docker-compose.prod.yml 的 FLYWAY_DB_USER），
    # 平时业务请求处理走的是限权账号，不会长期持有建表权限。
    url: ${FLYWAY_DB_URL:${spring.datasource.url}}
    user: ${FLYWAY_DB_USER:${ENTERPRISE_DB_USER:root}}
    password: ${FLYWAY_DB_PASSWORD:${ENTERPRISE_DB_PASSWORD:}}

# 审计事件（audit_event 表）写入专用账号：只被授予 INSERT/SELECT，见
# com.enterprisehub.audit.AuditService 和 docs/enterprise-rbac-plan.md 第21节。
# 未单独设置 AUDIT_DB_USER/AUDIT_DB_PASSWORD 时退回主账号，仅适合本地开发。
audit:
  datasource:
    username: ${AUDIT_DB_USER:${ENTERPRISE_DB_USER:root}}
    password: ${AUDIT_DB_PASSWORD:${ENTERPRISE_DB_PASSWORD:}}

# 跨服务签名（docs/enterprise-business-hub-plan.md 第 6 节）：FastAPI 签发短时效
# RequestContext，这里用同一把密钥校验 HMAC。本地开发默认值只用于双方都跑在本机的场景，
# 生产必须由部署方各自生成一个随机密钥并保持两边一致（同 JWT_SECRET_KEY 的管理方式）。
enterprise-hub:
  security:
    hmac-secret: ${ENTERPRISE_HUB_HMAC_SECRET:dev-only-shared-secret-change-me}
    max-clock-skew-seconds: 300

management:
  endpoints:
    web:
      exposure:
        include: health,info
