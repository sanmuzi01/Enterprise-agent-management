# 一条命令跑起整套：MySQL + Redis + Chroma + 后端 API + 后台 Worker + 企业业务中心（Java）+ 前端。
#   docker compose up -d --build            # 第一次要下载 / 构建镜像（Python、Maven、Node），需要几分钟
#   # 首启后端会自动建表；想要演示数据（一家虚构公司：5 个部门、11 个固定账号、一批进行中的业务单据）：
#   docker compose exec api python scripts/seed_enterprise_demo.py
#   # 打开 http://localhost:8080 ，演示账号和密码见 docs/demo-script.md（密码都是 Demo@12345，例如 demo_emp / demo_head）
#   docker compose down        # 停掉（数据保留在卷里）；docker compose down -v 连数据一起清掉
#
# 和本机直接跑（python scripts/demo.py start）互不影响：这里的 MySQL 是容器自己的，数据在 Docker 卷里，不碰你本机的数据库；
# 但两种方式用的端口有重叠（后端 8011、Java 8090），不要同时跑——先停掉一边。
#
# 国内网络：apt / PyPI / npm / Maven 访问官方源不稳时，在项目根目录的 .env 里加上（也可以只加需要的）：
#   APT_MIRROR=mirrors.aliyun.com
#   PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple
#   NPM_REGISTRY=https://registry.npmmirror.com
#   MAVEN_MIRROR_URL=https://maven.aliyun.com/repository/public
#
# 仅用于本地体验 / 演示。生产部署见 docs/deployment.md（用 systemd，不用 compose）。
# 下面的密钥是公开的演示值，正式用请在项目根目录建 .env 覆盖。

x-backend-env: &backend-env
  APP_ENV: dev
  DB_HOST: db
  DB_PORT: "3306"
  DB_USER: root
  DB_PASSWORD: ${DB_PASSWORD:-devpass}
  DB_NAME: ${DB_NAME:-agent_sql}
  REDIS_URL: redis://redis:6379/0
  # 下面两个是公开的演示值（谁都能在这份代码里看到），只用来让 `docker compose up`
  # 零配置跑通。启动时的生产配置校验会精确识别并拒绝这两个值——只要在 .env 里
  # 覆盖了真实值，一切正常；只要忘了覆盖又把 APP_ENV 设成 production，会直接启动失败
  # 而不是带着一把公开密钥悄悄上线。
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-not-a-secret-change-me}
  LLM_ENCRYPTION_KEY: ${LLM_ENCRYPTION_KEY:-LG5sThiGcVsg9jRbbN_fezONjfKdo3E72yQPYIUwZHQ=}
  KNOWLEDGE_FILE_PATH: /app/data/knowledge_files
  # Chroma 走独立 Server（见下面 chroma 服务）：api 和 worker 是两个进程，
  # 各自内嵌 PersistentClient 并发读写同一份 sqlite 文件有损坏风险。
  CHROMA_SERVER_HOST: chroma
  CHROMA_SERVER_PORT: "8000"
  # 飞书 / 钉钉真机联调：公网域名必须加进 TRUSTED_HOSTS（否则回调被 Host 白名单拒绝），在项目根目录的 .env 里覆盖即可
  TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1}
  CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:8080}
  # 飞书 / 钉钉接入（docs/collaboration-integrations.md）：公网 HTTPS 地址、网页地址、通知推送开关、开放平台地址
  INTEGRATION_PUBLIC_BASE_URL: ${INTEGRATION_PUBLIC_BASE_URL:-}
  INTEGRATION_WEB_BASE_URL: ${INTEGRATION_WEB_BASE_URL:-http://localhost:8080}
  INTEGRATION_PUSH_NOTIFICATIONS: ${INTEGRATION_PUSH_NOTIFICATIONS:-1}
  FEISHU_BASE_URL: ${FEISHU_BASE_URL:-https://open.feishu.cn}
  DINGTALK_BASE_URL: ${DINGTALK_BASE_URL:-https://api.dingtalk.com}
  DINGTALK_OAPI_URL: ${DINGTALK_OAPI_URL:-https://oapi.dingtalk.com}
  WIDGET_SCHEDULER_ENABLED: "1"
  # 企业业务中心（Java）：部门工作台的请假、采购、CRM、报销、IT、责任协同都要它。
  # 两边的签名密钥必须一致；这是公开的演示值，正式用请在 .env 里覆盖。
  ENTERPRISE_HUB_BASE_URL: http://enterprise-hub:8090
  ENTERPRISE_HUB_HMAC_SECRET: ${ENTERPRISE_HUB_HMAC_SECRET:-dev-only-shared-secret-change-me}
  ENTERPRISE_DB_HOST: db
  ENTERPRISE_DB_PORT: "3306"
  ENTERPRISE_DB_NAME: enterprise_business
  ENTERPRISE_DB_USER: root
  ENTERPRISE_DB_PASSWORD: ${DB_PASSWORD:-devpass}
  # 离线演示模型：不联网、不需要 API Key，演示账号和“试一试”都能直接用；要接真实模型就在页面里配置自己的 Key。
  OFFLINE_DEMO_MODEL: ${OFFLINE_DEMO_MODEL:-1}

x-backend-build: &backend-build
  context: .
  args:
    APT_MIRROR: ${APT_MIRROR:-}
    PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}

services:
  chroma:
    image: chromadb/chroma:1.5.9
    volumes:
      # Chroma 1.x 镜像把数据存在 /data（以前挂在 /chroma/chroma，数据其实留在容器里，重建就丢）
      - chroma_data:/data
    healthcheck:
      # Chroma 1.5.9 镜像不带 curl/wget；用镜像内置 Bash 检查服务端口。
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000"]
      interval: 10s
      timeout: 5s
      retries: 12

  db:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-devpass}
      MYSQL_DATABASE: ${DB_NAME:-agent_sql}
    volumes:
      - mysql_data:/var/lib/mysql
      # 第一次初始化（数据卷为空）时给企业业务中心建它自己的库 enterprise_business
      - ./deploy/mysql-init/01-create-enterprise-business-db.sql:/docker-entrypoint-initdb.d/01-create-enterprise-business-db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD:-devpass}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  enterprise-hub:
    build:
      context: ./enterprise-business-hub
      args:
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-}
    environment:
      ENTERPRISE_DB_HOST: db
      ENTERPRISE_DB_PORT: "3306"
      ENTERPRISE_DB_NAME: enterprise_business
      ENTERPRISE_DB_USER: root
      ENTERPRISE_DB_PASSWORD: ${DB_PASSWORD:-devpass}
      ENTERPRISE_HUB_HMAC_SECRET: ${ENTERPRISE_HUB_HMAC_SECRET:-dev-only-shared-secret-change-me}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # 容器内部仍是 8090；主机改用 18090，避开 Windows/Hyper-V 保留端口冲突。
      - "127.0.0.1:18090:8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18

  api:
    build: *backend-build
    command: sh -c "python -m alembic upgrade head && python -m uvicorn FasdtApi.main:app --host 0.0.0.0 --port 8000"
    environment: *backend-env
    volumes: &backend-volumes
      - app_data:/app/data
      - prompt_data:/app/prompt/prompts
      # 运行时写入的 Skill 配置必须放在数据卷里：部门 Agent 发布时生成的专业技能（skills/enterprise）不在卷里的话，
      # 每次重建容器都会丢，Agent 就调不了业务工具了。用户新建的 Skill 也是运行时文件。
      - skill_enterprise:/app/skills/enterprise
      - skill_imports:/app/skills/imported
      - skill_user_created:/app/skills/user_created
      - skill_templates:/app/skills/user_templates
      - skill_packages:/app/skills_packages/imported
      - chart_data:/app/static/charts
      - agent_templates:/app/agent_templates
      - app_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      chroma:
        condition: service_healthy
      enterprise-hub:
        condition: service_healthy
    ports:
      - "8011:8000"       # 直连后端（调 API / 看 /metrics）
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build: *backend-build
    command: python -m service.background_worker
    environment: *backend-env
    volumes: *backend-volumes    # 与 api 共享：worker 写入库文件/原始文档、读部门 Agent 的专业技能
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  prompt_data:
  skill_enterprise:
  skill_imports:
  skill_user_created:
  skill_templates:
  skill_packages:
  chart_data:
  agent_templates:
  app_logs:
  mysql_data:
  redis_data:
  chroma_data:
  app_data:
