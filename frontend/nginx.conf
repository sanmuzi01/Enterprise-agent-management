# docker-compose 用：nginx 托管 SPA，/api 反代到 api 容器（服务名 api，端口 8000）。
server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    # 发版后开着的旧页面要能拿到新版本（见 frontend/src/utils/staleBuild.ts）：
    # - 入口页每次都向服务器确认有没有新版本（no-cache 不是不缓存，是每次都要先确认，没变就 304）；
    # - /assets/ 下是构建产物，文件名带内容哈希、内容永远不变，可以长期缓存；找不到就是 404，不能退回首页——
    #   退回首页的话旧页面拿到的是一段 HTML，浏览器当脚本执行失败，用户看到的是“点了没反应”。
    # 这里只用 expires，不在 location 里写 add_header：location 里一旦写了 add_header，上面 server 级的安全头（CSP 等）就不再继承。
    location = /index.html {
        expires -1;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    # SSE 流式对话：关缓冲，长超时
    location /api/chat/ {
        proxy_pass http://api:8000/chat/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health  { proxy_pass http://api:8000/health;  proxy_set_header Host $host; }
    location = /metrics { proxy_pass http://api:8000/metrics; proxy_set_header Host $host; }
}
