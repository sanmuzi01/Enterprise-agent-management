# HTTP is kept for ACME validation and redirected to HTTPS otherwise.
server {
    listen 80;
    server_name sanmuzi.asia www.sanmuzi.asia;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/agent-platform;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name sanmuzi.asia www.sanmuzi.asia;

    ssl_certificate /etc/letsencrypt/live/sanmuzi.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sanmuzi.asia/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 50m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /var/www/agent-platform;
    index index.html;

    # 发版后开着的旧页面要能拿到新版本（见 frontend/src/utils/staleBuild.ts）：
    # - 入口页每次都向服务器确认有没有新版本（no-cache 不是不缓存，是每次都要先确认，没变就 304）；
    # - /assets/ 下是构建产物，文件名带内容哈希、内容永远不变，可以长期缓存；找不到就是 404，不能退回首页——
    #   退回首页的话旧页面拿到的是一段 HTML，浏览器当脚本执行失败，用户看到的是“点了没反应”。
    # 这里只用 expires，不在 location 里写 add_header：location 里一旦写了 add_header，上面 server 级的安全头（CSP 等）就不再继承。
    location = /index.html {
        expires -1;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # 存活 / 就绪探针：/live 只确认进程活着；/ready（与 /health 相同）在数据库不可用时返回 503，负载均衡据此摘掉实例
    location = /live {
        proxy_pass http://127.0.0.1:8000/live;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location = /ready {
        proxy_pass http://127.0.0.1:8000/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8000/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location /api/chat/ {
        proxy_pass http://127.0.0.1:8000/chat/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
